server.port: 9000
spring:
  application:
    name: my-msa-board-article-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/article
    username: ${USER_NAME}
    password: ${PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-vie: false
    show-sql: true
    hibernate:
      ddl-auto: none
  logging:
    level:
      root: INFO
      org.springframework.web: DEBUG
      my.msa.board: DEBUG